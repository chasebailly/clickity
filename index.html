<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Clickity — a lightweight, cross-platform autoclicker" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/clickity-mark.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>Clickity</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!--
      THESIS: Clickity is a timing instrument for quick gaming sessions; it refuses the legacy autoclicker form stack and the neon gamer dashboard.
      OWN-WORLD: Matte carbon and graphite surfaces, warm white type, chartreuse active fields, steel secondary marks, broad rails, and compact instrument numerals.
      STORY: Set the interval first, choose click behavior, confirm the target, then start or stop with complete state visibility.
      FIRST VIEWPORT: Brand above a continuous four-part timing strip; three full-width setting rails follow; the shortcut and persistent run dock close the window.
      FORM: User-approved Quick Panel, Timing-led / Interval First composition; seed 6ff3fdb2.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <div class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img class="brand-mark" src="/src/assets/clickity-mark.svg" alt="" width="56" height="56" />
          <div>
            <h1>Clickity</h1>
            <p>Clicks, right on cue.</p>
          </div>
        </div>
      </header>

      <form id="click-form" novalidate>
        <section class="interval-panel" aria-labelledby="interval-heading">
          <h2 id="interval-heading">Click interval</h2>
          <div class="interval-console">
            <div class="interval-grid" aria-describedby="interval-error">
              <label class="number-field">
                <span>Hours</span>
                <span class="interval-input-shell">
                  <input id="hours" data-setting type="number" inputmode="numeric" min="0" max="9999" step="1" value="0" />
                  <span class="stepper">
                    <button data-setting data-step-target="hours" data-step="1" type="button" aria-label="Increase hours"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4" /></svg></button>
                    <button data-setting data-step-target="hours" data-step="-1" type="button" aria-label="Decrease hours"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
                  </span>
                </span>
              </label>
              <label class="number-field">
                <span>Minutes</span>
                <span class="interval-input-shell">
                  <input id="minutes" data-setting type="number" inputmode="numeric" min="0" max="59" step="1" value="0" />
                  <span class="stepper">
                    <button data-setting data-step-target="minutes" data-step="1" type="button" aria-label="Increase minutes"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4" /></svg></button>
                    <button data-setting data-step-target="minutes" data-step="-1" type="button" aria-label="Decrease minutes"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
                  </span>
                </span>
              </label>
              <label class="number-field">
                <span>Seconds</span>
                <span class="interval-input-shell">
                  <input id="seconds" data-setting type="number" inputmode="numeric" min="0" max="59" step="1" value="1" />
                  <span class="stepper">
                    <button data-setting data-step-target="seconds" data-step="1" type="button" aria-label="Increase seconds"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4" /></svg></button>
                    <button data-setting data-step-target="seconds" data-step="-1" type="button" aria-label="Decrease seconds"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
                  </span>
                </span>
              </label>
              <label class="number-field">
                <span>Milliseconds</span>
                <span class="interval-input-shell">
                  <input id="milliseconds" data-setting type="number" inputmode="numeric" min="0" max="999" step="1" value="0" />
                  <span class="stepper">
                    <button data-setting data-step-target="milliseconds" data-step="1" type="button" aria-label="Increase milliseconds"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 10 4-4 4 4" /></svg></button>
                    <button data-setting data-step-target="milliseconds" data-step="-1" type="button" aria-label="Decrease milliseconds"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4" /></svg></button>
                  </span>
                </span>
              </label>
            </div>
            <div class="interval-summary" id="interval-summary">Every 1 second</div>
          </div>
          <p class="field-message error-text" id="interval-error" role="alert"></p>
        </section>

        <fieldset class="control-row mouse-row">
          <legend>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Zm0 0v7" /></svg>
            <span>Mouse button</span>
          </legend>
          <div class="control-body">
            <div class="segmented-control three-up">
              <label><input data-setting type="radio" name="button" value="left" checked /><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Zm0 0v7" /><path class="segment-fill" d="M6 9a6 6 0 0 1 6-6v7H6Z" /></svg>Left</span></label>
              <label><input data-setting type="radio" name="button" value="middle" /><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Zm0 0v7" /><rect class="segment-fill" x="10.5" y="3" width="3" height="7" rx="1.5" /></svg>Middle</span></label>
              <label><input data-setting type="radio" name="button" value="right" /><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v6a6 6 0 0 0 12 0V9a6 6 0 0 0-6-6Zm0 0v7" /><path class="segment-fill" d="M12 3a6 6 0 0 1 6 6v1h-6Z" /></svg>Right</span></label>
            </div>
          </div>
        </fieldset>

        <fieldset class="control-row repeat-row">
          <legend>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5 20.5 6 17 9.5M4 11V9a3 3 0 0 1 3-3h13M7 21.5 3.5 18 7 14.5M20 13v2a3 3 0 0 1-3 3H4" /></svg>
            <span>Repeat</span>
          </legend>
          <div class="control-body repeat-controls">
            <div class="segmented-control two-up">
              <label><input data-setting type="radio" name="repeat-mode" value="untilStopped" /><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.5 7.5c-3.5 0-5.5 9-9 9a4.5 4.5 0 1 1 0-9c3.5 0 5.5 9 9 9a4.5 4.5 0 1 0 0-9Z" /></svg>Until stopped</span></label>
              <label><input data-setting type="radio" name="repeat-mode" value="count" checked /><span>Count</span></label>
            </div>
            <label class="count-field">
              <span>Clicks</span>
              <input class="count-input" id="repeat-count" data-setting aria-describedby="repeat-error" type="number" inputmode="numeric" min="1" max="1000000000" step="1" value="10" />
            </label>
            <p class="field-message error-text" id="repeat-error" role="alert"></p>
          </div>
        </fieldset>

        <fieldset class="control-row position-row">
          <legend>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3M8 12a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z" /></svg>
            <span>Cursor position</span>
          </legend>
          <div class="control-body">
            <div class="position-controls">
              <div class="segmented-control two-up">
                <label><input data-setting type="radio" name="position-mode" value="current" checked /><span>Follow cursor</span></label>
                <label><input data-setting type="radio" name="position-mode" value="fixed" /><span>Fixed position</span></label>
              </div>
              <button class="capture-button" id="capture-position" data-setting type="button" aria-describedby="capture-help position-error">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v3m0 14v3M2 12h3m14 0h3M8 12a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z" /></svg>
                <span>Capture</span>
                <kbd>F7</kbd>
              </button>
            </div>
            <div class="coordinate-row" id="coordinate-row" aria-describedby="position-error">
              <p id="capture-help">Select Capture, move the pointer, then press <kbd>F7</kbd>.</p>
              <label class="coordinate-field"><span>X</span><input id="position-x" data-setting type="number" inputmode="numeric" step="1" value="0" /></label>
              <label class="coordinate-field"><span>Y</span><input id="position-y" data-setting type="number" inputmode="numeric" step="1" value="0" /></label>
            </div>
            <p class="field-message error-text" id="position-error" role="alert"></p>
          </div>
        </fieldset>

        <section class="hotkey-row" aria-labelledby="hotkey-heading">
          <div class="row-label">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16v11H4zM7 10h.01M10.5 10h.01M14 10h.01M17.5 10h.01M7 13h.01M10.5 13h.01M14 13h3.5M7 15.5h7" /></svg>
            <div><h2 id="hotkey-heading">Start / stop shortcut</h2><p>Works while Clickity is in the background.</p></div>
          </div>
          <div class="hotkey-control">
            <kbd id="hotkey-display">F6</kbd>
            <button class="secondary-button" id="change-hotkey" data-setting type="button">Change</button>
          </div>
          <p class="hotkey-capture-copy" id="hotkey-capture-copy" aria-live="polite"></p>
          <p class="field-message error-text" id="hotkey-error" role="alert"></p>
        </section>

        <div class="action-area">
          <div class="run-state" id="status-pill" data-phase="idle">
            <span class="status-dot" aria-hidden="true"></span>
            <div class="run-copy">
              <strong id="run-title">Ready when you are</strong>
              <span id="run-detail">The first click happens after one interval.</span>
            </div>
            <span class="sr-only" id="status-label">Idle</span>
          </div>
          <button class="primary-button" id="action-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z" /></svg>
            <span id="action-label">Start clicking</span>
            <kbd id="action-hotkey">F6</kbd>
          </button>
        </div>
      </form>

      <div class="sr-only" id="live-region" aria-live="polite" aria-atomic="true"></div>
    </div>
  </body>
</html>
